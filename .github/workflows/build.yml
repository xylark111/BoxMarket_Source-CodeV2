name: Build BoxMarket
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Susun struktur folder
        run: |
          for f in src__*; do
            t="${f//__//}"
            mkdir -p "$(dirname "$t")"
            mv "$f" "$t"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: BoxMarket-jar
          path: target/BoxMarket-1.0.0.jar
